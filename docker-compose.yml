version: "3.8"
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: url_shortener_dynamodb
    ports:
      - "8000:8000"
    command: ["-jar","DynamoDBLocal.jar","-inMemory","-sharedDb"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/shell/"]
      interval: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url_shortener_api
    ports:
      - "8080:8080"
    env_file:
      - .env.example
    environment:
      # 1. Ensure AWS SDKs and custom code use the in-compose DynamoDB service by name
      AWS_ENDPOINT_URL: "http://dynamodb:8000"
      AWS_ENDPOINT: "http://dynamodb:8000"

      # 2. Force OTLP exporter to use insecure (plaintext) gRPC so no TLS handshake is attempted
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_COLLECTOR_ENDPOINT: "otel-collector:4317"

      # standard app envs
      DYNAMODB_TABLE_NAME: "Urls"
      AWS_REGION: "us-east-1"
      SHARDID: "1"
      PORT: "8080"
      AWS_ACCESS_KEY_ID: "local"
      AWS_SECRET_ACCESS_KEY: "local"
    depends_on:
      - dynamodb
      - otel-collector
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/readyz || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: url_shortener_otelcol
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # metrics (optional)
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.47
    container_name: url_shortener_jaeger
    ports:
      - "16686:16686" # Jaeger UI

  prometheus:
    image: prom/prometheus:latest
    container_name: url_shortener_prom
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

networks:
  default:
    name: url_shortener_network
